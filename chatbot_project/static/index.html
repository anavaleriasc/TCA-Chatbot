<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Multiusuario | Inteligencia Artificial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #auth-container,
        #chat-container {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #auth-container {
            max-width: 440px;
            border-radius: 16px;
            padding: 28px;
        }

        body.chat-ready #auth-container {
            display: none;
        }

        #auth-container h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        #auth-container p {
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .auth-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .auth-option {
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .auth-option.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        .auth-submit {
            margin-top: 6px;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.45);
        }

        .auth-submit:disabled {
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        #auth-feedback {
            min-height: 20px;
            margin-top: 14px;
            color: #fca5a5;
            font-size: 0.9rem;
        }

        #chat-container {
            max-width: 600px;
            height: 85vh;
            border-radius: 20px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        body.chat-ready #chat-container {
            display: flex;
        }

        #chat-header {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .bot-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #22c55e;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #session-display {
            color: #e2e8f0;
            font-size: 0.75rem;
            text-align: right;
        }

        #logout-btn {
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(15,23,42,0.2);
            color: white;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 600;
        }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }

        #chat-history::-webkit-scrollbar {
            width: 6px;
        }

        #chat-history::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
        }

        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bot-message.loading {
            background: transparent;
            color: #94a3b8;
            font-style: italic;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #334155;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 15px;
            border-radius: 30px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #3b82f6;
        }

        #send-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 0 0 50px;
        }

        #send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .send-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <h1>Acesse o chatbot</h1>
        <p>Entre com uma conta existente ou crie um cadastro para iniciar a conversa.</p>

        <div class="auth-options">
            <button class="auth-option active" id="login-option" type="button" onclick="setAuthMode('login')">Já possuo conta</button>
            <button class="auth-option" id="register-option" type="button" onclick="setAuthMode('register')">Cadastro</button>
        </div>

        <form class="auth-form active" id="login-form">
            <div class="form-group">
                <label for="login-email-input">E-mail</label>
                <input type="email" id="login-email-input" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="login-password-input">Senha</label>
                <input type="password" id="login-password-input" autocomplete="current-password" required>
            </div>

            <button class="auth-submit" id="login-btn" type="submit">Entrar</button>
        </form>

        <form class="auth-form" id="register-form">
            <div class="form-group">
                <label for="register-name-input">Nome</label>
                <input type="text" id="register-name-input" minlength="2" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="register-email-input">E-mail</label>
                <input type="email" id="register-email-input" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="register-password-input">Senha</label>
                <input type="password" id="register-password-input" minlength="6" autocomplete="new-password" required>
            </div>

            <button class="auth-submit" id="register-btn" type="submit">Cadastrar</button>
        </form>

        <div id="auth-feedback" role="status"></div>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <div class="bot-title">
                <span class="status-dot"></span>Gemini AI Bot
            </div>
            <div class="user-area">
                <div id="session-display">Sessao: Iniciando...</div>
                <button id="logout-btn" type="button" onclick="logout()">Sair</button>
            </div>
        </div>

        <div id="chat-history">
            <div class="message bot-message">Ola! Eu sou o assistente de inteligencia artificial construido com Gemini. Como posso ajudar voce hoje?</div>
        </div>

        <div id="input-area">
            <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()" aria-label="Enviar mensagem">
                <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const messageInput = document.getElementById('message-input');
        const sessionDisplay = document.getElementById('session-display');
        const authFeedback = document.getElementById('auth-feedback');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginButton = document.getElementById('login-btn');
        const registerButton = document.getElementById('register-btn');
        const loginOption = document.getElementById('login-option');
        const registerOption = document.getElementById('register-option');

        let sessionId = sessionStorage.getItem("chatbot_session_id");
        let authToken = sessionStorage.getItem("chatbot_access_token");
        let currentUser = JSON.parse(sessionStorage.getItem("chatbot_user") || "null");

        if (sessionId) {
            updateSessionDisplay();
        }

        if (currentUser && authToken) {
            showChat();
        }

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            await loginUser();
        });

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            await registerUser();
        });

        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function setAuthMode(mode) {
            const isLogin = mode === "login";
            loginOption.classList.toggle("active", isLogin);
            registerOption.classList.toggle("active", !isLogin);
            loginForm.classList.toggle("active", isLogin);
            registerForm.classList.toggle("active", !isLogin);
            authFeedback.innerText = "";
        }

        async function loginUser() {
            const email = document.getElementById('login-email-input').value.trim();
            const password = document.getElementById('login-password-input').value;
            await submitAuth('/login', { email, password }, loginButton, "Entrando...");
        }

        async function registerUser() {
            const name = document.getElementById('register-name-input').value.trim();
            const email = document.getElementById('register-email-input').value.trim();
            const password = document.getElementById('register-password-input').value;
            await submitAuth('/register', { name, email, password }, registerButton, "Cadastrando...");
        }

        async function submitAuth(url, payload, button, loadingText) {
            const originalText = button.innerText;
            authFeedback.innerText = "";
            button.disabled = true;
            button.innerText = loadingText;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Nao foi possivel autenticar.");
                }

                authToken = data.access_token;
                currentUser = data.user;
                sessionStorage.setItem("chatbot_access_token", authToken);
                sessionStorage.setItem("chatbot_user", JSON.stringify(currentUser));
                showChat();
            } catch (error) {
                authFeedback.innerText = error.message;
            } finally {
                button.disabled = false;
                button.innerText = originalText;
            }
        }

        async function sendMessage() {
            if (!currentUser || !authToken) {
                authFeedback.innerText = "Faca login antes de iniciar o chat.";
                logout();
                return;
            }

            const text = messageInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            messageInput.value = '';

            const loadingId = "loading-" + Date.now();
            appendMessage("Digitando...", 'bot-message loading', loadingId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: text
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Falha ao enviar mensagem.");
                }

                if (data.session_id) {
                    sessionId = data.session_id;
                    sessionStorage.setItem("chatbot_session_id", sessionId);
                    updateSessionDisplay();
                }

                document.getElementById(loadingId).remove();
                appendMessage(data.response, 'bot-message');
            } catch (error) {
                console.error("Erro no Fetch:", error);
                document.getElementById(loadingId).remove();
                appendMessage("Erro: " + error.message, 'bot-message');
                if (error.message.includes("Token")) {
                    logout();
                }
            }
        }

        function appendMessage(text, className, id = null) {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            if (id) div.id = id;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function showChat() {
            document.body.classList.add("chat-ready");
            updateSessionDisplay();

            if (!chatHistory.dataset.userShown) {
                appendMessage("Usuario autenticado: " + currentUser.name + ".", 'bot-message');
                chatHistory.dataset.userShown = "true";
            }

            messageInput.focus();
        }

        function updateSessionDisplay() {
            const userName = currentUser ? currentUser.name : "Usuario";
            const sessionText = sessionId ? sessionId.substring(0, 8) + "..." : "nova";
            sessionDisplay.innerText = userName + " | Sessao: " + sessionText;
        }

        function logout() {
            authToken = null;
            currentUser = null;
            sessionId = null;
            sessionStorage.removeItem("chatbot_access_token");
            sessionStorage.removeItem("chatbot_user");
            sessionStorage.removeItem("chatbot_session_id");
            document.body.classList.remove("chat-ready");
            chatHistory.dataset.userShown = "";
            authFeedback.innerText = "";
            setAuthMode("login");
        }
    </script>
</body>
</html>
